name: dev-alignmabzoo

services:
  dev-alignmabzoo:
    image: dev-alignmabzoo:${ALIGNMABZOO_DEV_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ALIGNMABZOO_DATA_ROOT: /synced_data/mabzoo
      ALIGNMABZOO_JOBS_ROOT: /app/jobs
      MAX_CONCURRENT_JOBS: "2"
      MMSEQS_NUM_THREADS: "1"
    volumes:
      - /home/bioinfo/synced_data/mabzoo:/synced_data/mabzoo:ro
      - /home/bioinfo/containers/alignmabzoo-dev/jobs:/app/jobs
    ports:
      - "127.0.0.1:${ALIGNMABZOO_DEV_PORT:-5000}:8000"
    expose:
      - "8000"
    cpus: 2.0
    networks:
      - internal-net
    # После `docker compose build` обязательно выполнить внутри образа:
    # Команды проверки dev-образа приведены в docs/dev-deployment.md.

networks:
  internal-net:
    external: true
