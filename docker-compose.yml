name: alignmabzoo

services:
  alignmabzoo:
    image: alignmabzoo:${ALIGNMABZOO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MMSEQS_GIT_REF: ${MMSEQS_GIT_REF:-master}
    restart: unless-stopped
    environment:
      ALIGNMABZOO_DATA_ROOT: /synced_data/mabzoo
      ALIGNMABZOO_JOBS_ROOT: /app/jobs
      MAX_CONCURRENT_JOBS: "2"
      MMSEQS_NUM_THREADS: "1"
    volumes:
      - /home/bioinfo/synced_data/mabzoo:/synced_data/mabzoo:ro
      - /home/bioinfo/containers/alignmabzoo/jobs:/app/jobs
    expose:
      - "8000"
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal-net

networks:
  internal-net:
    external: true
