name: alignmabzoo

services:
  alignmabzoo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ALIGNMABZOO_DATA_ROOT: /synced_data/mabzoo
      ALIGNMABZOO_JOBS_ROOT: /app/jobs
      MAX_CONCURRENT_JOBS: "2"
    volumes:
      - /home/bioinfo/synced/data/mabzoo:/synced_data/mabzoo:ro
      - /home/bioinfo/containers/alignmabzoo/jobs:/app/jobs
    expose:
      - "8000"
    cpus: 2.0
    networks:
      - internal-net
    # После `docker compose build` обязательно выполнить внутри образа:
    # docker compose run --rm --no-deps alignmabzoo sh -c 'python -c "import anarci; from pathlib import Path; hmm = Path(anarci.__file__).parent / \"dat\" / \"HMMs\" / \"ALL.hmm\"; assert hmm.is_file(), hmm" && ANARCI --help && hmmscan -h && clustalo --version'

networks:
  internal-net:
    external: true
