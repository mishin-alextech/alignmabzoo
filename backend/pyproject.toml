[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alignmabzoo-backend"
version = "0.1.0"
description = "Backend сервиса AlignMabZoo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "gunicorn>=23.0,<24.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "biopython>=1.84,<2.0",
    "autosnapgene>=0.2.0",
    "anyio>=4.4,<5.0",
    "aiofiles>=24.1,<25.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.services"]
